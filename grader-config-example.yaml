grader:
  working_dir: "/tmp/grader"
  grades_file: "leaderboard.json"
  worker_url: "https://grader-api.example.com"
  worker_private_key: "keys/grader.key" # admin key authorized in the worker's ADMIN_PUBLIC_KEYS
  sentry_dsn: ""

pusher:
  github_repo: "user/MCPLeaderboard"
  github_pat: "pat_example_1234567890" # needs write access to github_repo
  save_file: "data/leaderboard.json"
  push: true


assignments:
  - name: "vector-sum" # must match the assignment_name students submit to the worker
    preserve_repo_files: false

    tasks:
      - name: "test-cpu"
        skip: true
        blocking: true
        test_script_path: "./test_scripts/test_vectorsum_cpu.sh"

        slurm_backend:
          config:
            slurm_partition: "short"
            timeout_min: 60
            mem_gb: 4
            nodes: 1
            tasks_per_node: 1
            cpus_per_task: 2
            gpus_per_node: 1
      - name: "test-gpu"
        skip: false
        blocking: true
        test_script_path: "./test_scripts/test_vectorsum_gpu.sh"
        submission_timeout: 300 # seconds per student; omit for no limit
        slurm_backend:
          config:
            slurm_partition: "gpu"
            timeout_min: 60
            mem_gb: 8
            nodes: 1
            tasks_per_node: 1
            cpus_per_task: 4
            gpus_per_node: 1